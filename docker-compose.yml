services:
  db:
    image: postgres:16-alpine
    container_name: sheba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheba
      POSTGRES_PASSWORD: sheba_dev_password
      POSTGRES_DB: sheba_dev
    ports:
      - "5432:5432"
    volumes:
      - sheba_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheba -d sheba_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sheba_pg_data:
